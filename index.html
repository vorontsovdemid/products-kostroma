<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Заказы на товар</title>
<style>
:root {
  --bg: #f5f5f5; --surface: #fff; --text: #333; --border: #ddd;
  --th-bg: #f0f0f0; --input-border: #ccc; --primary: #007bff;
  --primary-hover: #0056b3; --danger: #dc3545; --danger-hover: #b02a37;
  --note: #777; --even-row: #fafafa; --dl-bg: #fff5f5; --sb-bg: #999;
  --sb-hover: #777;
}
[data-theme="dark"] {
  --bg: #1a1a2e; --surface: #16213e; --text: #e0e0e0; --border: #334155;
  --th-bg: #1e293b; --input-border: #475569; --primary: #3b82f6;
  --primary-hover: #2563eb; --danger: #ef4444; --danger-hover: #dc2626;
  --note: #94a3b8; --even-row: #1e293b; --dl-bg: #2d1b1b; --sb-bg: #475569;
  --sb-hover: #64748b;
}
body {
  font-family: Arial, sans-serif;
  background: var(--bg); color: var(--text);
  padding: 12px; margin: 0;
  transition: background 0.3s, color 0.3s;
}
.container {
  max-width: 860px; margin: 0 auto;
  background: var(--surface); color: var(--text);
  padding: 20px; border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
h1, h2, h3 { color: var(--text); margin-top: 0; }
.header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 10px;
}
.user-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.theme-btn {
  padding: 6px 12px; font-size: 18px;
  background: var(--sb-bg); color: #fff;
  border: none; border-radius: 5px; cursor: pointer; margin: 0;
}
.theme-btn:hover { background: var(--sb-hover); }
.small-btn {
  padding: 5px 10px; font-size: 13px;
  background: var(--sb-bg); color: #fff;
  border: none; border-radius: 5px; cursor: pointer; margin: 0;
}
.small-btn:hover { background: var(--sb-hover); }
.login-form, .order-form {
  display: flex; flex-direction: column; gap: 12px; max-width: 380px;
}
label { display: block; font-weight: 600; }
input, select {
  width: 100%; padding: 9px;
  border: 1px solid var(--input-border); border-radius: 5px;
  box-sizing: border-box; font-size: 15px;
  background: var(--surface); color: var(--text);
}
button {
  padding: 10px 16px; background: var(--primary); color: #fff;
  border: none; border-radius: 5px; cursor: pointer;
  font-size: 15px; margin-bottom: 8px;
}
button:hover { background: var(--primary-hover); }
button:disabled { background: #ccc; cursor: not-allowed; color: #888; }
.danger-btn { background: var(--danger); }
.danger-btn:hover { background: var(--danger-hover); }
.form-buttons { display: flex; gap: 8px; align-items: center; }
.error { color: var(--danger); font-size: 14px; min-height: 20px; }
.note { color: var(--note); font-size: 13px; }

.start-warning {
  color: var(--danger); font-size: 24px; font-weight: 700;
  text-align: center; margin: 20px 0; padding: 24px 16px;
  border: 3px solid var(--danger); border-radius: 10px;
  background: var(--dl-bg); line-height: 1.5;
}

.deadline-box {
  margin: 14px 0; padding: 12px 16px;
  border: 2px solid var(--danger); border-radius: 8px;
  background: var(--dl-bg); color: var(--danger);
  font-weight: 700; font-size: 15px; text-align: center;
}

.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-top: 12px;
}
table { width: 100%; border-collapse: collapse; min-width: 380px; }
th, td {
  border: 1px solid var(--border); padding: 8px 10px; text-align: left;
  word-break: break-word;
}
th { background: var(--th-bg); white-space: nowrap; }
tr:nth-child(even) { background: var(--even-row); }
td.num { text-align: right; white-space: nowrap; }

hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.hidden { display: none; }
.admin-section { margin-bottom: 22px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.btn-row button { margin-bottom: 0; }
.settings-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.settings-row label { flex: 1; min-width: 180px; }
.settings-row button { margin-bottom: 0; white-space: nowrap; }
.markup-label { margin-top: 14px; }
.markup-label input { max-width: 160px; }
.price-input { max-width: 130px; }

@media (max-width: 520px) {
  body { padding: 8px; }
  .container { padding: 16px; border-radius: 8px; }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  th, td { padding: 6px 8px; font-size: 14px; }
  .start-warning { font-size: 20px; padding: 18px 12px; }
  .deadline-box { font-size: 13px; padding: 10px 12px; }
  button { padding: 9px 14px; font-size: 14px; }
}
</style>
</head>
<body>

<!-- ────── Экран входа ────── -->
<div id="login-screen" class="container">
  <div class="header">
    <h1>Вход</h1>
    <button class="theme-btn" id="theme-toggle-login" type="button">🌙</button>
  </div>

  <div id="start-warning" class="start-warning hidden">
    ЗАКАЗЫ ПРИНИМАЮТСЯ С<br><span id="start-time-display"></span>
  </div>

  <form id="login-form" class="login-form">
    <label>Имя:
      <input type="text" id="login-name" autocomplete="username" placeholder="Ваше имя" />
    </label>
    <label>Пароль:
      <input type="password" id="login-pass" autocomplete="current-password" placeholder="Пароль" />
    </label>
    <button type="submit" id="login-btn">Войти</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<!-- ────── Основной экран ────── -->
<div id="app-screen" class="container hidden">
  <div class="header">
    <h1>Приём заказов</h1>
    <div class="user-info">
      <span id="current-user"></span>
      <button id="logout-btn" class="small-btn" type="button">Выйти</button>
      <button class="theme-btn" id="theme-toggle-app" type="button">🌙</button>
    </div>
  </div>

  <div id="deadline-box" class="deadline-box hidden">
    <span id="deadline-text"></span>
  </div>

  <div id="order-form-section" class="order-form">
    <h2 id="form-title">Добавить товар в заказ</h2>
    <label>Товар:
      <select id="product"></select>
    </label>
    <label>Количество (кг):
      <input type="number" id="kg" step="0.01" min="0.01" inputmode="decimal" placeholder="кг" />
    </label>
    <div class="form-buttons">
      <button type="button" id="save-order">Добавить</button>
      <button type="button" id="cancel-edit" class="small-btn hidden">Отменить</button>
    </div>
    <p id="form-note" class="note"></p>
  </div>

  <h2 id="orders-title">Мой заказ</h2>
  <div class="table-wrap">
    <table id="orders-table">
      <thead>
        <tr>
          <th>Товар</th>
          <th>Кг</th>
          <th id="th-user">Заказчик</th>
          <th id="th-date">Дата</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>

  <div id="admin-panel" class="hidden">
    <hr />
    <h2>Админ-панель</h2>

    <div class="admin-section">
      <h3>Цены и наценка</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Товар</th>
              <th>Цена, руб/кг</th>
            </tr>
          </thead>
          <tbody id="prices-body"></tbody>
        </table>
      </div>
      <label class="markup-label">Наценка за перевозку, %:
        <input type="number" id="markup-input" step="0.1" min="0" inputmode="decimal" />
      </label>
      <button type="button" id="save-prices">Сохранить цены и наценку</button>
    </div>

    <div class="admin-section">
      <h3>Время начала приёма заказов</h3>
      <div class="settings-row">
        <label>Открыть заказы с:
          <input type="datetime-local" id="start-input" />
        </label>
        <button type="button" id="set-start">Установить</button>
        <button type="button" id="clear-start" class="small-btn">Сбросить</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Дедлайн правок</h3>
      <div class="settings-row">
        <label>Закрыть правки после:
          <input type="datetime-local" id="deadline-input" />
        </label>
        <button type="button" id="set-deadline">Установить</button>
        <button type="button" id="clear-deadline" class="small-btn">Сбросить</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Действия</h3>
      <div class="btn-row">
        <button id="export-excel" type="button">Итоги → Excel</button>
        <button id="clear-orders" class="danger-btn" type="button">Очистить все заказы</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Кто сколько должен</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Заказчик</th>
              <th>Товаров</th>
              <th>Сумма с наценкой, руб</th>
            </tr>
          </thead>
          <tbody id="debts-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  НАСТРОЙКИ
// ──────────────────────────────────────────────

const PRODUCTS = [
  'Картофель', 'Морковь', 'Лук репчатый',
  'Капуста белокочанная', 'Свёкла', 'Помидоры',
  'Огурцы', 'Яблоки', 'Груши', 'Мука пшеничная',
];

const USERS = {
  admin: { password: 'admin123', role: 'admin' },
  ivan:  { password: 'ivan456',  role: 'user'  },
  maria: { password: 'maria789', role: 'user'  },
};

// ──────────────────────────────────────────────
//  Безопасное хранилище
// ──────────────────────────────────────────────

const storage = (() => {
  try {
    const t = '__test__';
    localStorage.setItem(t, t);
    localStorage.removeItem(t);
    return localStorage;
  } catch (e) {
    const mem = {};
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
    };
  }
})();

// ──────────────────────────────────────────────
//  Элементы
// ──────────────────────────────────────────────

const $ = id => document.getElementById(id);

const loginScreen  = $('login-screen');
const appScreen    = $('app-screen');
const loginForm    = $('login-form');
const loginName    = $('login-name');
const loginPass    = $('login-pass');
const loginError   = $('login-error');
const startWarning = $('start-warning');
const startTimeDisplay = $('start-time-display');
const orderFormSection = $('order-form-section');
const productSelect    = $('product');
const kgInput          = $('kg');
const saveBtn          = $('save-order');
const cancelEditBtn    = $('cancel-edit');
const formTitle        = $('form-title');
const formNote         = $('form-note');
const ordersBody       = $('orders-body');
const ordersTitle      = $('orders-title');
const thUser           = $('th-user');
const thDate           = $('th-date');
const deadlineBox      = $('deadline-box');
const deadlineText     = $('deadline-text');
const deadlineInput    = $('deadline-input');
const setDeadlineBtn   = $('set-deadline');
const clearDeadlineBtn = $('clear-deadline');
const startInput       = $('start-input');
const setStartBtn      = $('set-start');
const clearStartBtn    = $('clear-start');
const pricesBody       = $('prices-body');
const markupInput      = $('markup-input');
const savePricesBtn    = $('save-prices');
const exportBtn        = $('export-excel');
const clearBtn         = $('clear-orders');
const adminPanel       = $('admin-panel');
const debtsBody        = $('debts-body');
const currentUserEl    = $('current-user');
const logoutBtn        = $('logout-btn');
const themeToggleLogin = $('theme-toggle-login');
const themeToggleApp   = $('theme-toggle-app');

// ──────────────────────────────────────────────
//  Состояние
// ──────────────────────────────────────────────

let currentUser = null;
let editingIndex = -1;

let orders = {};
try {
  orders = JSON.parse(storage.getItem('orders')) || {};
} catch (e) { orders = {}; }

// Цены: { "Картофель": 45, ... }
let prices = {};
try {
  prices = JSON.parse(storage.getItem('prices')) || {};
} catch (e) { prices = {}; }

// Наценка за перевозку, %
let markup = parseFloat(storage.getItem('markup')) || 0;

let deadline = null;
try {
  if (storage.getItem('orderDeadline')) deadline = new Date(storage.getItem('orderDeadline'));
} catch (e) {}

let startTime = null;
try {
  if (storage.getItem('orderStartTime')) startTime = new Date(storage.getItem('orderStartTime'));
} catch (e) {}

let wasEditable = true;
let wasOpen = true;

// ──────────────────────────────────────────────
//  Тема
// ──────────────────────────────────────────────

let theme = storage.getItem('theme') || 'light';
applyTheme();

function applyTheme() {
  document.documentElement.setAttribute('data-theme', theme);
  const icon = theme === 'dark' ? '☀️' : '🌙';
  themeToggleLogin.textContent = icon;
  themeToggleApp.textContent = icon;
}

function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  storage.setItem('theme', theme);
  applyTheme();
}

themeToggleLogin.addEventListener('click', toggleTheme);
themeToggleApp.addEventListener('click', toggleTheme);

// ──────────────────────────────────────────────
//  Утилиты
// ──────────────────────────────────────────────

function saveOrders() {
  storage.setItem('orders', JSON.stringify(orders));
}

function isOrderingOpen() {
  return !startTime || Date.now() >= startTime.getTime();
}

function isEditable() {
  return !deadline || Date.now() < deadline.getTime();
}

function formatCountdown(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const p = n => String(n).padStart(2, '0');
  return (d > 0 ? d + ' дн ' : '') + p(h) + ':' + p(m) + ':' + p(s);
}

function toLocalInputValue(date) {
  const off = date.getTimezoneOffset() * 60000;
  return new Date(date.getTime() - off).toISOString().slice(0, 16);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function fmtRub(x) {
  return x.toFixed(2).replace('.', ',');
}

function fmtKg(x) {
  return String(x).replace('.', ',');
}

function withMarkup(amount) {
  return amount * (1 + markup / 100);
}

// Стоимость заказа пользователя (с наценкой)
function userTotal(order) {
  let sum = 0;
  (order.items || []).forEach(i => {
    sum += (i.kg || 0) * (prices[i.product] || 0);
  });
  return withMarkup(sum);
}

// Список только реально заказанных товаров
function getOrderedProducts() {
  return PRODUCTS.filter(p =>
    Object.values(orders).some(o => (o.items || []).some(i => i.product === p))
  );
}

function renderDeadline() {
  if (!deadline) {
    deadlineBox.classList.add('hidden');
    return;
  }
  deadlineBox.classList.remove('hidden');
  if (Date.now() < deadline.getTime()) {
    deadlineText.textContent =
      '⏰ Правки до ' + deadline.toLocaleString('ru-RU') +
      '  |  Осталось: ' + formatCountdown(deadline.getTime() - Date.now());
  } else {
    deadlineText.textContent =
      '⛔ Время истекло (' + deadline.toLocaleString('ru-RU') + '). Правки закрыты.';
  }
}

function renderStartWarning() {
  if (!startTime || Date.now() >= startTime.getTime()) {
    startWarning.classList.add('hidden');
    return;
  }
  startWarning.classList.remove('hidden');
  startTimeDisplay.textContent = startTime.toLocaleString('ru-RU');
}

setInterval(() => {
  renderStartWarning();
  if (!currentUser) return;

  renderDeadline();
  const open = isOrderingOpen();
  const editable = isEditable();
  saveBtn.disabled = !editable || !open;

  if (!open) {
    formNote.textContent = 'Приём заказов ещё не начался.';
  } else if (!editable) {
    formNote.textContent = 'Срок истёк — добавление и правка закрыты.';
  } else if (editingIndex < 0) {
    formNote.textContent = '';
  }

  if (wasEditable !== editable || wasOpen !== open) {
    renderOrders();
    wasEditable = editable;
    wasOpen = open;
  }
}, 1000);

// ──────────────────────────────────────────────
//  Отрисовка
// ──────────────────────────────────────────────

function fillProducts() {
  productSelect.innerHTML = '';
  PRODUCTS.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = prices[p] > 0 ? p + ' — ' + fmtRub(prices[p]) + ' руб/кг' : p;
    productSelect.appendChild(opt);
  });
}

function renderPrices() {
  pricesBody.innerHTML = '';
  PRODUCTS.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + escapeHtml(p) + '</td>';
    const td = document.createElement('td');
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = '0.01';
    inp.min = '0';
    inp.inputMode = 'decimal';
    inp.className = 'price-input';
    inp.dataset.product = p;
    inp.value = prices[p] !== undefined ? prices[p] : '';
    td.appendChild(inp);
    tr.appendChild(td);
    pricesBody.appendChild(tr);
  });
  markupInput.value = markup > 0 ? markup : '';
}

function renderDebts() {
  debtsBody.innerHTML = '';
  const entries = Object.values(orders);

  if (entries.length === 0) {
    debtsBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--note);">Нет заказов</td></tr>';
    return;
  }

  entries
    .sort((a, b) => a.user.localeCompare(b.user))
    .forEach(order => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(order.user) + '</td>' +
        '<td class="num">' + (order.items || []).length + '</td>' +
        '<td class="num">' + fmtRub(userTotal(order)) + '</td>';
      debtsBody.appendChild(tr);
    });
}

function renderOrders() {
  ordersBody.innerHTML = '';
  const editable = isEditable() && isOrderingOpen();
  const isAdmin = currentUser.role === 'admin';

  if (isAdmin) {
    ordersTitle.textContent = 'Все заказы';
    thUser.style.display = '';
    thDate.style.display = '';

    let rows = [];
    Object.values(orders).forEach(order => {
      (order.items || []).forEach(item => {
        rows.push({
          user: order.user,
          product: item.product,
          kg: item.kg,
          date: order.editedAt || order.date,
        });
      });
    });

    if (rows.length === 0) {
      ordersBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--note);">Заказов нет</td></tr>';
      renderDebts();
      return;
    }

    rows.sort((a, b) => a.user.localeCompare(b.user) || a.product.localeCompare(b.product));

    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(r.product) + '</td>' +
        '<td class="num">' + fmtKg(r.kg) + '</td>' +
        '<td>' + escapeHtml(r.user) + '</td>' +
        '<td>' + escapeHtml(r.date) + '</td>' +
        '<td></td>';
      ordersBody.appendChild(tr);
    });

    renderDebts();

  } else {
    ordersTitle.textContent = 'Мой заказ';
    thUser.style.display = 'none';
    thDate.style.display = 'none';

    const myOrder = orders[currentUser.name];
    const items = myOrder ? (myOrder.items || []) : [];

    if (items.length === 0) {
      ordersBody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--note);">Ваш заказ пуст. Добавьте товары.</td></tr>';
      return;
    }

    items.forEach((item, idx) => {
      const tr = document.createElement('tr');
      const price = prices[item.product] || 0;
      tr.innerHTML =
        '<td>' + escapeHtml(item.product) + '</td>' +
        '<td class="num">' + fmtKg(item.kg) + '</td>' +
        '<td></td>';

      if (editable) {
        const cell = tr.lastElementChild;

        const editBtn = document.createElement('button');
        editBtn.textContent = '✎';
        editBtn.className = 'small-btn';
        editBtn.title = 'Редактировать';
        editBtn.style.marginRight = '4px';
        editBtn.addEventListener('click', () => startEditItem(idx));

        const delBtn = document.createElement('button');
        delBtn.textContent = '🗑';
        delBtn.className = 'small-btn danger-btn';
        delBtn.title = 'Удалить';
        delBtn.addEventListener('click', () => deleteItem(idx));

        cell.append(editBtn, delBtn);
      }

      ordersBody.appendChild(tr);
    });
  }
}

function startEditItem(idx) {
  const myOrder = orders[currentUser.name];
  if (!myOrder || !isEditable() || !isOrderingOpen()) return;

  const item = myOrder.items[idx];
  if (!item) return;

  editingIndex = idx;
  productSelect.value = item.product;
  kgInput.value = item.kg;
  formTitle.textContent = 'Редактировать товар';
  saveBtn.textContent = 'Сохранить';
  cancelEditBtn.classList.remove('hidden');
  formNote.textContent = 'Режим правки.';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  editingIndex = -1;
  kgInput.value = '';
  formTitle.textContent = 'Добавить товар в заказ';
  saveBtn.textContent = 'Добавить';
  cancelEditBtn.classList.add('hidden');
  formNote.textContent = '';
}

function deleteItem(idx) {
  if (!isEditable() || !isOrderingOpen()) return;
  if (!confirm('Удалить этот товар из заказа?')) return;

  const myOrder = orders[currentUser.name];
  if (!myOrder) return;

  myOrder.items.splice(idx, 1);

  if (myOrder.items.length === 0) {
    delete orders[currentUser.name];
  } else {
    myOrder.editedAt = new Date().toLocaleString('ru-RU');
  }

  if (editingIndex === idx) {
    resetForm();
  } else if (editingIndex > idx) {
    editingIndex--;
  }

  saveOrders();
  renderOrders();
}

// ──────────────────────────────────────────────
//  Загрузка XLSX-библиотеки (лениво)
// ──────────────────────────────────────────────

function loadXlsxLib() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(); return; }

    const urls = [
      'https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    ];

    let i = 0;
    const tryNext = () => {
      if (i >= urls.length) { reject(); return; }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = resolve;
      s.onerror = () => { s.remove(); tryNext(); };
      document.head.appendChild(s);
    };
    tryNext();
  });
}

function downloadFile(content, filename, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 200);
}

// ──────────────────────────────────────────────
//  Данные итогов
// ──────────────────────────────────────────────

function buildSummary() {
  const entries = Object.values(orders);
  const ordered = getOrderedProducts();

  // По товарам
  const byProduct = ordered.map(p => {
    let totalKg = 0;
    entries.forEach(o => {
      const item = (o.items || []).find(i => i.product === p);
      if (item) totalKg += item.kg;
    });
    const price = prices[p] || 0;
    const cost = totalKg * price;
    return {
      product: p,
      totalKg: totalKg,
      price: price,
      cost: cost,
      costWithMarkup: withMarkup(cost),
    };
  });

  // По людям
  const byUser = entries
    .map(o => ({
      user: o.user,
      items: (o.items || []).filter(i => ordered.includes(i.product)),
      total: userTotal(o),
    }))
    .sort((a, b) => a.user.localeCompare(b.user));

  return { ordered, byProduct, byUser };
}

function exportToCsv() {
  const { ordered, byProduct, byUser } = buildSummary();

  const lines = [];

  // Блок 1: заказы по людям
  lines.push('ЗАКАЗЫ');
  lines.push(['Заказчик'].concat(ordered, ['Итого с наценкой, руб']).join(';'));
  byUser.forEach(u => {
    const row = ['"' + u.user + '"'];
    ordered.forEach(p => {
      const item = u.items.find(i => i.product === p);
      row.push(item ? fmtKg(item.kg) : '');
    });
    row.push('"' + fmtRub(u.total) + '"');
    lines.push(row.join(';'));
  });

  lines.push('');
  lines.push('Наценка: ' + fmtRub(markup) + '%');

  // Блок 2: сводка по товарам
  lines.push('');
  lines.push('СВОДКА ПО ТОВАРАМ');
  lines.push('Товар;Всего, кг;Цена руб/кг;Стоимость, руб;С наценкой, руб');
  byProduct.forEach(r => {
    lines.push(
      '"' + r.product + '";' +
      fmtKg(r.totalKg) + ';' +
      fmtRub(r.price) + ';' +
      '"' + fmtRub(r.cost) + '";' +
      '"' + fmtRub(r.costWithMarkup) + '"'
    );
  });

  // Блок 3: долги
  lines.push('');
  lines.push('КТО СКОЛЬКО ДОЛЖЕН');
  lines.push('Заказчик;Сумма с наценкой, руб');
  byUser.forEach(u => {
    lines.push('"' + u.user + '";"' + fmtRub(u.total) + '"');
  });

  const csv = lines.join('\n');
  const dateStr = new Date().toISOString().slice(0, 10);
  downloadFile(csv, 'itogi_' + dateStr + '.csv', 'text/csv;charset=utf-8');
}

function exportToExcel() {
  const entries = Object.values(orders);
  if (entries.length === 0) {
    alert('Нет заказов для выгрузки');
    return;
  }

  // Проверка цен
  const ordered = getOrderedProducts();
  const missing = ordered.filter(p => !(prices[p] > 0));
  if (missing.length > 0) {
    alert('Сначала укажите цены для товаров: ' + missing.join(', '));
    return;
  }

  exportBtn.disabled = true;
  const oldText = exportBtn.textContent;
  exportBtn.textContent = 'Загрузка...';

  loadXlsxLib().then(() => {
    const { ordered: ord, byProduct, byUser } = buildSummary();

    // Лист 1: заказы по людям (только заказанные товары)
    const matrixData = byUser.map(u => {
      const row = { 'Заказчик': u.user };
      ord.forEach(p => {
        const item = u.items.find(i => i.product === p);
        row[p] = item ? item.kg : '';
      });
      row['Итого с наценкой, руб'] = parseFloat(u.total.toFixed(2));
      return row;
    });

    // Лист 2: сводка по товарам
    const productData = byProduct.map(r => ({
      'Товар': r.product,
      'Всего, кг': parseFloat(r.totalKg.toFixed(2)),
      'Цена, руб/кг': r.price,
      'Стоимость, руб': parseFloat(r.cost.toFixed(2)),
      'С наценкой, руб': parseFloat(r.costWithMarkup.toFixed(2)),
    }));

    // Лист 3: кто сколько должен
    const debtsData = byUser.map(u => ({
      'Заказчик': u.user,
      'Сумма с наценкой, руб': parseFloat(u.total.toFixed(2)),
    }));

    // Лист 4: настройки
    const settingsData = [{ 'Наценка, %': markup }];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(matrixData), 'Заказы');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(productData), 'Сводка');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debtsData), 'Долги');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(settingsData), 'Настройки');

    XLSX.writeFile(wb, 'itogi_' + new Date().toISOString().slice(0, 10) + '.xlsx');

    exportBtn.disabled = false;
    exportBtn.textContent = oldText;
  }).catch(() => {
    exportToCsv();
    exportBtn.disabled = false;
    exportBtn.textContent = oldText;
  });
}

// ──────────────────────────────────────────────
//  События
// ──────────────────────────────────────────────

loginForm.addEventListener('submit', e => {
  e.preventDefault();

  const name = loginName.value.trim();
  const pass = loginPass.value;
  const user = USERS[name];

  if (!user || user.password !== pass) {
    loginError.textContent = 'Неверное имя или пароль';
    return;
  }

  if (user.role !== 'admin' && !isOrderingOpen()) {
    loginError.textContent = 'Заказывать можно только с ' + startTime.toLocaleString('ru-RU');
    return;
  }

  currentUser = { name, role: user.role };
  loginError.textContent = '';
  loginName.value = '';
  loginPass.value = '';

  loginScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
  currentUserEl.textContent = '👤 ' + name +
    ' (' + (user.role === 'admin' ? 'админ' : 'пользователь') + ')';

  if (user.role === 'admin') {
    adminPanel.classList.remove('hidden');
    orderFormSection.classList.add('hidden');
    if (deadline) deadlineInput.value = toLocalInputValue(deadline);
    if (startTime) startInput.value = toLocalInputValue(startTime);
    renderPrices();
  } else {
    adminPanel.classList.add('hidden');
    orderFormSection.classList.remove('hidden');
  }

  fillProducts();
  renderDeadline();
  renderOrders();
});

logoutBtn.addEventListener('click', () => {
  currentUser = null;
  resetForm();
  appScreen.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  renderStartWarning();
});

saveBtn.addEventListener('click', () => {
  if (!isOrderingOpen()) {
    alert('Приём заказов ещё не начался');
    return;
  }
  if (!isEditable()) {
    alert('Срок приёма правок истёк');
    return;
  }

  const product = productSelect.value;
  const kg = parseFloat((kgInput.value || '').replace(',', '.'));

  if (!product || isNaN(kg) || kg <= 0) {
    alert('Выберите товар и укажите количество больше 0');
    return;
  }

  if (!orders[currentUser.name]) {
    orders[currentUser.name] = {
      user: currentUser.name,
      items: [],
      date: new Date().toLocaleString('ru-RU'),
      editedAt: '',
    };
  }

  const myOrder = orders[currentUser.name];

  if (editingIndex >= 0) {
    myOrder.items[editingIndex].product = product;
    myOrder.items[editingIndex].kg = kg;
    myOrder.editedAt = new Date().toLocaleString('ru-RU');
    resetForm();
  } else {
    const existing = myOrder.items.findIndex(i => i.product === product);
    if (existing >= 0) {
      alert('Этот товар уже в заказе. Отредактируйте его вместо добавления нового.');
      return;
    }
    myOrder.items.push({ product, kg });
    myOrder.editedAt = new Date().toLocaleString('ru-RU');
    kgInput.value = '';
  }

  saveOrders();
  renderOrders();
});

cancelEditBtn.addEventListener('click', resetForm);

// ── Цены и наценка (админ) ──

savePricesBtn.addEventListener('click', () => {
  let ok = true;
  pricesBody.querySelectorAll('input[data-product]').forEach(inp => {
    const val = parseFloat((inp.value || '').replace(',', '.'));
    if (isNaN(val) || val < 0) {
      inp.style.borderColor = 'var(--danger)';
      ok = false;
    } else {
      inp.style.borderColor = '';
      prices[inp.dataset.product] = val;
    }
  });

  const mk = parseFloat((markupInput.value || '0').replace(',', '.'));
  if (isNaN(mk) || mk < 0) {
    markupInput.style.borderColor = 'var(--danger)';
    ok = false;
  } else {
    markupInput.style.borderColor = '';
    markup = mk;
  }

  if (!ok) {
    alert('Проверьте значения: цена и наценка должны быть числами от 0 и выше');
    return;
  }

  storage.setItem('prices', JSON.stringify(prices));
  storage.setItem('markup', String(markup));
  fillProducts();
  renderDebts();
  alert('Сохранено. Наценка: ' + fmtRub(markup) + '%');
});

// ── Время начала (админ) ──

setStartBtn.addEventListener('click', () => {
  if (!startInput.value) {
    alert('Выберите дату и время');
    return;
  }
  startTime = new Date(startInput.value);
  storage.setItem('orderStartTime', startTime.toISOString());
  renderStartWarning();
  alert('Начало заказов: ' + startTime.toLocaleString('ru-RU'));
});

clearStartBtn.addEventListener('click', () => {
  startTime = null;
  storage.removeItem('orderStartTime');
  startInput.value = '';
  renderStartWarning();
  alert('Ограничение на начало заказов снято.');
});

// ── Дедлайн (админ) ──

setDeadlineBtn.addEventListener('click', () => {
  if (!deadlineInput.value) {
    alert('Выберите дату и время');
    return;
  }
  deadline = new Date(deadlineInput.value);
  storage.setItem('orderDeadline', deadline.toISOString());
  renderDeadline();
  renderOrders();
  alert('Дедлайн установлен: ' + deadline.toLocaleString('ru-RU'));
});

clearDeadlineBtn.addEventListener('click', () => {
  deadline = null;
  storage.removeItem('orderDeadline');
  deadlineInput.value = '';
  renderDeadline();
  renderOrders();
  alert('Дедлайн снят.');
});

// ── Экспорт (админ) ──

exportBtn.addEventListener('click', exportToExcel);

clearBtn.addEventListener('click', () => {
  if (!confirm('Удалить все заказы? Действие нельзя отменить.')) return;
  orders = {};
  saveOrders();
  renderOrders();
});

renderStartWarning();
</script>
