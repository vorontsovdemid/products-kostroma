<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ продуктов | Кострома</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .form-group { margin-bottom: 1.25rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        select, input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .price-display {
            background-color: #f9fafb;
            border-color: #e5e7eb;
            color: var(--primary);
            font-weight: bold;
        }

        button.submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.submit-btn:hover { background-color: var(--primary-hover); }
        button.submit-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }

        .success { color: var(--success); }
        .error { color: var(--danger); }
        .loading { color: var(--primary); }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛒 Заказ продуктов</h1>

        <div class="form-group">
            <label for="productSelect">Выберите товар</label>
            <select id="productSelect" required>
                <option value="" disabled selected>Загрузка товаров...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantityInput">Количество (кг)</label>
            <input type="number" id="quantityInput" value="1" min="0.1" step="0.1" required>
        </div>

        <div class="form-group">
            <label>Итоговая стоимость</label>
            <input type="text" id="totalPriceDisplay" class="price-display" readonly value="0 ₽">
        </div>

        <button type="button" class="submit-btn" id="orderBtn" onclick="sendOrder()">
            Оформить заказ
        </button>

        <div id="status"></div>
    </div>

    <script>
        // Переменная больше не нужна для формирования URL, адрес вшит напрямую в fetch
        
        const productSelect = document.getElementById('productSelect');
        const quantityInput = document.getElementById('quantityInput');
        const totalPriceDisplay = document.getElementById('totalPriceDisplay');
        const statusDiv = document.getElementById('status');
        const orderBtn = document.getElementById('orderBtn');

        document.addEventListener('DOMContentLoaded', loadProducts);

        async function loadProducts() {
            setStatus('Загрузка товаров...', 'loading');
            orderBtn.disabled = true;

            try {
                // ИСПРАВЛЕНИЕ: Жестко прописанный URL вместо переменной
                const response = await fetch('https://orders-kostroma-default-rtdb.europe-west1.firebasedatabase.app/products.json');
                
                if (!response.ok) {
                    throw new Error(`Ошибка сети: \${response.status}`);
                }

                const data = await response.json();

                if (!data || Object.keys(data).length === 0) {
                    productSelect.innerHTML = '<option value="" disabled>В базе нет товаров</option>';
                    setStatus('Товары не найдены. Проверьте узел "products" в Firebase.', 'error');
                    return;
                }

                productSelect.innerHTML = '<option value="" disabled selected>Выберите товар</option>';
                
                Object.keys(data).forEach(key => {
                    const product = data[key];
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `${product.name} — ${product.price} ₽/кг`;
                    option.dataset.price = product.price;
                    productSelect.appendChild(option);
                });

                productSelect.addEventListener('change', updateTotal);
                quantityInput.addEventListener('input', updateTotal);

                updateTotal();
                setStatus('Товары загружены. Можно оформлять заказ.', 'success');
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                setStatus('Ошибка: проверьте консоль (F12) и правила доступа в Firebase.', 'error');
            } finally {
                orderBtn.disabled = false;
            }
        }

        function updateTotal() {
            const selectedOption = productSelect.options[productSelect.selectedIndex];
            const price = parseFloat(selectedOption.dataset.price) || 0;
            const quantity = parseFloat(quantityInput.value) || 0;
            const total = price * quantity;

            if (total > 0) {
                totalPriceDisplay.value = `\${total.toLocaleString('ru-RU')} ₽`;
            } else {
                totalPriceDisplay.value = '0 ₽';
            }
        }

        async function sendOrder() {
            const selectedOption = productSelect.options[productSelect.selectedIndex];
            const productId = selectedOption.value;
            const productName = selectedOption.textContent.split(' —');
            const quantity = parseFloat(quantityInput.value);
            const pricePerKg = parseFloat(selectedOption.dataset.price);
            const total = quantity * pricePerKg;

            if (!productId || quantity <= 0) {
                setStatus('Пожалуйста, выберите товар и укажите корректное количество.', 'error');
                return;
            }

            orderBtn.disabled = true;
            orderBtn.innerHTML = '<span class="spinner"></span> Отправка заказа...';
            setStatus('', '');

            try {
                const orderData = {
                    product_id: productId,
                    product_name: productName,
                    quantity_kg: quantity,
                    price_per_kg: pricePerKg,
                    total_price: total,
                    timestamp: new Date().toISOString(),
                    status: 'new'
                };

                // ИСПРАВЛЕНИЕ: Жестко прописанный URL для отправки
                const response = await fetch('https://orders-kostroma-default-rtdb.firebaseio.com/orders.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    setStatus('✅ Заказ успешно оформлен!', 'success');
                    productSelect.value = '';
                    quantityInput.value = '1';
                    totalPriceDisplay.value = '0 ₽';
                    updateTotal();
                } else {
                    throw new Error('Ошибка сервера Firebase');
                }
            } catch (error) {
                console.error('Ошибка отправки:', error);
                setStatus('❌ Не удалось отправить заказ. Проверьте Rules в Firebase.', 'error');
            } finally {
                orderBtn.disabled = false;
                orderBtn.innerHTML = 'Оформить заказ';
            }
        }

        function setStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type || '';
        }
    </script>
</body>
</html>
