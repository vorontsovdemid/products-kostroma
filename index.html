<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Data Sync</title>
  <style>
    :root { --primary: #2ea44f; --danger: #d73a49; --bg: #f6f8fa; --text: #24292e; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1, h2 { margin-top: 0; }
    .status { padding: 0.5rem 1rem; border-radius: 6px; display: inline-block; font-weight: 600; }
    .status.ok { background: #e6ffec; color: #0052cc; }
    .status.err { background: #ffeef0; color: #cb2431; }
    pre { background: #fff; border: 1px solid #e1e4e8; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    button { background: var(--primary); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #dcdcdc; color: #6a737d; cursor: not-allowed; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.6rem; border: 1px solid #d1d5da; border-radius: 6px; box-sizing: border-box; }
    .meta { font-size: 0.85rem; color: #586069; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Синхронизация данных с GitHub</h1>
    <p>Статус: <span id="status" class="status">Ожидание</span></p>

    <div class="form-group">
      <label for="message">Добавить тестовую запись (сообщение):</label>
      <input type="text" id="message" placeholder="Введите текст..." />
    </div>

    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
      <button id="btn-load">Загрузить данные</button>
      <button id="btn-save">Сохранить изменения</button>
    </div>

    <h2>Текущие данные (data.json)</h2>
    <pre id="data-display">{}</pre>

    <div class="meta">
      <p>Используемый прокси: <code>ghproxy.com</code> (для обхода CORS).</p>
      <p>Важно: токен GitHub хранится в коде. Для публичного репозитория не используйте реальный токен в этом файле.</p>
    </div>
  </div>

  <script type="module">
    // --- КОНФИГУРАЦИЯ (ОБЯЗАТЕЛЬНО ИЗМЕНИТЬ) ---
    const GH_CONFIG = {
      owner:  'vorontsovdemid',      // Ваш логин GitHub
      repo:   'products-kostroma',  // Имя репозитория
      file:   'data.json',           // Файл с данными
      branch: 'main',                // main или master
      token:  'github_pat_11BXYZabcdEFghIJklMNopQRstUVwxYZ_1234567890' // ВСТАВИТЬ ТОКЕН
    };

    const PROXY = 'https://ghproxy.com/'; // Прокси для обхода CORS

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
    function setStatus(text, type = 'info') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = 'status ' + (type === 'ok' ? 'ok' : 'err');
    }

    function b64DecodeUnicode(str) {
      return decodeURIComponent(atob(str).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }

    function b64EncodeUnicode(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    // --- ЗАГРУЗКА ДАННЫХ (GET) ---
    async function loadData() {
      const url = `${PROXY}https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.file}?ref=\${GH_CONFIG.branch}`;
      const headers = {
        'Authorization': `token \${GH_CONFIG.token}`,
        'Accept': 'application/vnd.github.v3+json'
      };

      setStatus('Загрузка...', 'info');
      try {
        const res = await fetch(url, { headers });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`${res.status}: ${errData.message || 'Ошибка GitHub'}`);
        }
        const data = await res.json();
        const content = b64DecodeUnicode(data.content);
        const json = JSON.parse(content);

        document.getElementById('data-display').textContent = JSON.stringify(json, null, 2);
        setStatus('Данные загружены успешно', 'ok');
        return { json, sha: data.sha };
      } catch (e) {
        console.error(e);
        setStatus('Ошибка: ' + e.message, 'err');
        return null;
      }
    }

    // --- СОХРАНЕНИЕ ДАННЫХ (PUT) ---
    async function saveData(newData) {
      const url = `${PROXY}https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.file}`;
      const headers = {
        'Authorization': `token \${GH_CONFIG.token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };

      // Получаем актуальный SHA перед записью (обязательно для GitHub API)
      const current = await loadData();
      if (!current) return;

      const contentBase64 = b64EncodeUnicode(JSON.stringify(newData));

      const payload = {
        message: 'Update data.json via web UI',
        content: contentBase64,
        sha: current.sha,
        branch: GH_CONFIG.branch
      };

      setStatus('Сохранение...', 'info');
      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers,
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`${res.status}: ${errData.message || 'Ошибка сохранения'}`);
        }
        setStatus('Данные сохранены!', 'ok');
        await loadData(); // Обновляем отображение
      } catch (e) {
        console.error(e);
        setStatus('Ошибка: ' + e.message, 'err');
      }
    }

    // --- ОБРАБОТЧИКИ СОБЫТИЙ ---
    document.getElementById('btn-load').addEventListener('click', loadData);

    document.getElementById('btn-save').addEventListener('click', async () => {
      const current = await loadData();
      if (!current) return;

      const messageInput = document.getElementById('message');
      const message = messageInput.value.trim();
      if (!message) {
        alert('Введите сообщение в поле выше.');
        return;
      }

      const newData = {
        ...current.json,
        entries: current.json.entries || [],
        test_entry: {
          id: Date.now(),
          message: message,
          timestamp: new Date().toISOString()
        }
      };

      // Если есть массив entries, добавим туда новую запись
      if (Array.isArray(newData.entries)) {
        newData.entries.push({
          id: Date.now(),
          message: message,
          timestamp: new Date().toISOString()
        });
      }

      await saveData(newData);
      messageInput.value = '';
    });

    // При загрузке страницы сразу пробуем загрузить данные
    loadData();
  </script>
</body>
</html>
