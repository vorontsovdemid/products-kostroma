<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заказы на товар</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1, h2 { color: #333; margin-top: 0; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .small-btn {
      padding: 5px 12px;
      font-size: 13px;
      background: #999;
      margin: 0;
    }
    .small-btn:hover { background: #777; }
    .login-form, .order-form, .deadline-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 360px;
    }
    label { display: block; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      padding: 10px 18px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 10px;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .danger-btn { background: #dc3545; }
    .danger-btn:hover { background: #b02a37; }
    .form-buttons { display: flex; gap: 10px; align-items: center; }
    .error { color: #dc3545; font-size: 14px; min-height: 20px; }
    .note { color: #777; font-size: 13px; }
    /* Дедлайн — красным */
    .deadline-box {
      margin: 16px 0;
      padding: 12px 16px;
      border: 2px solid #dc3545;
      border-radius: 8px;
      background: #fff5f5;
      color: #dc3545;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 9px 12px;
      text-align: left;
    }
    th { background: #f0f0f0; }
    tr:nth-child(even) { background: #fafafa; }
    hr { border: none; border-top: 1px solid #eee; margin: 28px 0; }
    .hidden { display: none; }
    .admin-section { margin-bottom: 24px; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .btn-row button { margin-bottom: 0; }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="login-screen" class="container">
    <h1>Вход</h1>
    <div class="login-form">
      <label>Имя:
        <input type="text" id="login-name" placeholder="Ваше имя" />
      </label>
      <label>Пароль:
        <input type="password" id="login-pass" placeholder="Пароль" />
      </label>
      <button type="button" id="login-btn">Войти</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- Основной экран -->
  <div id="app-screen" class="container hidden">
    <div class="header">
      <h1>Приём заказов</h1>
      <div class="user-info">
        <span id="current-user"></span>
        <button id="logout-btn" class="small-btn">Выйти</button>
      </div>
    </div>

    <!-- Дедлайн -->
    <div id="deadline-box" class="deadline-box hidden">
      <span id="deadline-text"></span>
    </div>

    <!-- Форма заказа -->
    <div class="order-form">
      <h2 id="form-title">Новый заказ</h2>
      <label>Товар:
        <select id="product"></select>
      </label>
      <label>Количество (кг):
        <input type="number" id="kg" step="0.01" min="0.01" placeholder="кг" />
      </label>
      <div class="form-buttons">
        <button type="button" id="save-order">Добавить заказ</button>
        <button type="button" id="cancel-edit" class="small-btn hidden">Отменить</button>
      </div>
      <p id="form-note" class="note"></p>
    </div>

    <!-- Таблица заказов -->
    <h2 id="orders-title">Мои заказы</h2>
    <table id="orders-table">
      <thead>
        <tr>
          <th>Товар</th>
          <th>Кг</th>
          <th id="th-user">Заказчик</th>
          <th>Дата</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>

    <!-- Админ-панель -->
    <div id="admin-panel" class="hidden">
      <hr />
      <h2>Админ-панель</h2>

      <div class="admin-section">
        <h3>Дедлайн правок</h3>
        <div class="deadline-form">
          <label>Дата и время:
            <input type="datetime-local" id="deadline-input" />
          </label>
          <button type="button" id="set-deadline">Установить дедлайн</button>
        </div>
      </div>

      <div class="admin-section">
        <h3>Действия</h3>
        <div class="btn-row">
          <button id="export-excel">Итоги → Excel</button>
          <button id="clear-orders" class="danger-btn">Очистить все заказы</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script>
  // ──────────────────────────────────────────────
  //  НАСТРОЙКИ
  // ──────────────────────────────────────────────

  const PRODUCTS = [
    'Картофель', 'Морковь', 'Лук репчатый',
    'Капуста белокочанная', 'Свёкла', 'Помидоры',
    'Огурцы', 'Яблоки', 'Груши', 'Мука пшеничная',
  ];

  const USERS = {
    admin: { password: 'admin123', role: 'admin' },
    ivan:  { password: 'ivan456',  role: 'user'  },
    maria: { password: 'maria789', role: 'user'  },
  };

  // ──────────────────────────────────────────────
  //  Элементы
  // ──────────────────────────────────────────────

  const $ = id => document.getElementById(id);
  const loginScreen = $('login-screen');
  const appScreen   = $('app-screen');
  const loginName   = $('login-name');
  const loginPass   = $('login-pass');
  const loginBtn    = $('login-btn');
  const loginError = $('login-error');
  const productSelect = $('product');
  const kgInput    = $('kg');
  const saveBtn    = $('save-order');
  const cancelEditBtn = $('cancel-edit');
  const formTitle  = $('form-title');
  const formNote   = $('form-note');
  const ordersBody = $('orders-body');
  const ordersTitle = $('orders-title');
  const thUser     = $('th-user');
  const deadlineBox = $('deadline-box');
  const deadlineText = $('deadline-text');
  const deadlineInput = $('deadline-input');
  const setDeadlineBtn = $('set-deadline');
  const exportBtn  = $('export-excel');
  const clearBtn   = $('clear-orders');
  const adminPanel = $('admin-panel');
  const currentUserEl = $('current-user');
  const logoutBtn  = $('logout-btn');

  let currentUser = null;
  let editingId = null;
  let orders = JSON.parse(localStorage.getItem('orders')) || [];
  let deadline = localStorage.getItem('orderDeadline')
    ? new Date(localStorage.getItem('orderDeadline'))
    : null;

  // ──────────────────────────────────────────────
  //  Утилиты
  // ──────────────────────────────────────────────

  function saveOrders() {
    localStorage.setItem('orders', JSON.stringify(orders));
  }

  function isEditable() {
    return !deadline || Date.now() < deadline.getTime();
  }

  function formatCountdown(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const d = Math.floor(total / 86400);
    const h = Math.floor((total % 86400) / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const p = n => String(n).padStart(2, '0');
    return (d > 0 ? d + ' дн ' : '') + p(h) + ':' + p(m) + ':' + p(s);
  }

  function renderDeadline() {
    if (!deadline) {
      deadlineBox.classList.add('hidden');
      return;
    }
    deadlineBox.classList.remove('hidden');
    if (Date.now() < deadline.getTime()) {
      deadlineText.textContent =
        '⏰ Правки до ' + deadline.toLocaleString('ru-RU') +
        '  |  Осталось: ' + formatCountdown(deadline.getTime() - Date.now());
    } else {
      deadlineText.textContent =
        '⛔ Время истекло (' + deadline.toLocaleString('ru-RU') + '). Правки закрыты.';
    }
  }

  // Обновление каждую секунду
  setInterval(() => {
    if (!currentUser) return;
    renderDeadline();
    const editable = isEditable();
    saveBtn.disabled = !editable;
    if (!editable) {
      formNote.textContent = 'Срок истёк — добавление и правка закрыты.';
    } else if (!editingId) {
      formNote.textContent = '';
    }
  }, 1000);

  // ──────────────────────────────────────────────
  //  Отрисовка
  // ──────────────────────────────────────────────

  function fillProducts() {
    productSelect.innerHTML = '';
    PRODUCTS.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      productSelect.appendChild(opt);
    });
  }

  function renderOrders() {
    ordersBody.innerHTML = '';
    const editable = isEditable();
    const isAdmin = currentUser.role === 'admin';

    // Пользователь видит только свои заказы, админ — все
    const visible = isAdmin
      ? orders
      : orders.filter(o => o.user === currentUser.name);

    ordersTitle.textContent = isAdmin ? 'Все заказы' : 'Мои заказы';

    // Колонку «Заказчик» показываем только админу
    thUser.style.display = isAdmin ? '' : 'none';

    if (visible.length === 0) {
      const colspan = isAdmin ? 5 : 4;
      ordersBody.innerHTML = '<tr><td colspan="' + colspan + '" style="text-align:center;color:#999;">Заказов нет</td></tr>';
      return;
    }

    visible.forEach(o => {
      const tr = document.createElement('tr');

      // Для пользователя — без колонки заказчика
      let cells = '<td>' + o.product + '</td><td>' + o.kg + '</td>';
      if (isAdmin) cells += '<td>' + o.user + '</td>';
      cells += '<td>' + o.date + '</td><td></td>';
      tr.innerHTML = cells;

      // Кнопки правки/удаления — автору до дедлайна
      if (!isAdmin && o.user === currentUser.name && editable) {
        const cell = tr.lastElementChild;

        const editBtn = document.createElement('button');
        editBtn.textContent = '✎';
        editBtn.className = 'small-btn';
        editBtn.title = 'Редактировать';
        editBtn.style.margin = '0 4px 0 0';
        editBtn.addEventListener('click', () => startEdit(o.id));

        const delBtn = document.createElement('button');
        delBtn.textContent = '🗑';
        delBtn.className = 'small-btn danger-btn';
        delBtn.title = 'Удалить';
        delBtn.style.margin = '0';
        delBtn.addEventListener('click', () => deleteOrder(o.id));

        cell.append(editBtn, delBtn);
      }

      ordersBody.appendChild(tr);
    });
  }

  function startEdit(id) {
    const order = orders.find(o => o.id === id);
    if (!order || !isEditable()) return;

    editingId = id;
    productSelect.value = order.product;
    kgInput.value = order.kg;
    formTitle.textContent = 'Правка заказа';
    saveBtn.textContent = 'Сохранить';
    cancelEditBtn.classList.remove('hidden');
    formNote.textContent = 'Режим правки заказа.';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null;
    kgInput.value = '';
    formTitle.textContent = 'Новый заказ';
    saveBtn.textContent = 'Добавить заказ';
    cancelEditBtn.classList.add('hidden');
    formNote.textContent = '';
  }

  function deleteOrder(id) {
    if (!isEditable()) return;
    if (!confirm('Удалить этот заказ?')) return;
    orders = orders.filter(o => o.id !== id);
    saveOrders();
    renderOrders();
  }

  // ──────────────────────────────────────────────
  //  События
  // ──────────────────────────────────────────────

  loginBtn.addEventListener('click', () => {
    const name = loginName.value.trim();
    const pass = loginPass.value;
    const user = USERS[name];

    if (!user || user.password !== pass) {
      loginError.textContent = 'Неверное имя или пароль';
      return;
    }

    currentUser = { name, role: user.role };
    loginError.textContent = '';
    loginName.value = '';
    loginPass.value = '';

    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    currentUserEl.textContent = '👤 ' + name +
      ' (' + (user.role === 'admin' ? 'админ' : 'пользователь') + ')';

    if (user.role === 'admin') {
      adminPanel.classList.remove('hidden');
      if (deadline) {
        const off = deadline.getTimezoneOffset() * 60000;
        deadlineInput.value = new Date(deadline.getTime() - off)
          .toISOString().slice(0, 16);
      }
    } else {
      adminPanel.classList.add('hidden');
    }

    fillProducts();
    renderDeadline();
    renderOrders();
  });

  logoutBtn.addEventListener('click', () => {
    currentUser = null;
    resetForm();
    appScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
  });

  saveBtn.addEventListener('click', () => {
    if (!isEditable()) {
      alert('Срок приёма правок истёк');
      return;
    }

    const product = productSelect.value;
    const kg = parseFloat(kgInput.value);

    if (!product || isNaN(kg) || kg <= 0) {
      alert('Выберите товар и укажите количество больше 0');
      return;
    }

    if (editingId) {
      const order = orders.find(o => o.id === editingId);
      if (order) {
        order.product = product;
        order.kg = kg;
        order.editedAt = new Date().toLocaleString('ru-RU');
      }
      resetForm();
    } else {
      orders.push({
        id: Date.now() + '_' + currentUser.name,
        product: product,
        kg: kg,
        user: currentUser.name,
        date: new Date().toLocaleString('ru-RU'),
      });
      kgInput.value = '';
    }

    saveOrders();
    renderOrders();
  });

  cancelEditBtn.addEventListener('click', resetForm);

  setDeadlineBtn.addEventListener('click', () => {
    if (!deadlineInput.value) {
      alert('Выберите дату и время');
      return;
    }
    deadline = new Date(deadlineInput.value);
    localStorage.setItem('orderDeadline', deadline.toISOString());
    renderDeadline();
    renderOrders();
    alert('Дедлайн установлен: ' + deadline.toLocaleString('ru-RU'));
  });

  exportBtn.addEventListener('click', () => {
    if (orders.length === 0) {
      alert('Нет заказов для выгрузки');
      return;
    }

    const allOrdersData = orders.map(o => ({
      'Товар': o.product,
      'Кг': o.kg,
      'Заказчик': o.user,
      'Дата': o.date,
    }));

    const summary = {};
    orders.forEach(o => {
      if (!summary[o.product]) summary[o.product] = { totalKg: 0, count: 0 };
      summary[o.product].totalKg += o.kg;
      summary[o.product].count += 1;
    });

    const summaryData = Object.entries(summary).map(([product, s]) => ({
      'Товар': product,
      'Всего, кг': s.totalKg.toFixed(2),
      'Кол-во заказов': s.count,
    }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allOrdersData), 'Все заказы');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryData), 'Сводка');
    XLSX.writeFile(wb, 'itogi_' + new Date().toISOString().slice(0, 10) + '.xlsx');
  });

  clearBtn.addEventListener('click', () => {
    if (!confirm('Удалить все заказы? Действие нельзя отменить.')) return;
    orders = [];
    saveOrders();
    renderOrders();
  });
  </script>
</body>
</html>
