<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ продуктов</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 15px; }
        h1 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        #status { margin-top: 20px; text-align: center; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <h1>Оформление заказа</h1>

    <div class="form-group">
        <label for="productSelect">Выберите товар:</label>
        <select id="productSelect">
            <option value="">Загрузка товаров...</option>
        </select>
    </div>

    <div class="form-group">
        <label for="quantityInput">Количество (кг):</label>
        <input type="number" id="quantityInput" value="1" min="1">
    </div>

    <div class="form-group">
        <label for="totalPriceDisplay">Итоговая стоимость:</label>
        <input type="text" id="totalPriceDisplay" readonly style="background-color: #f0f0f0;">
    </div>

    <button onclick="sendOrder()">Оформить заказ</button>

    <div id="status"></div>

    <script>
        // 1. ВСТАВЛЯЕМ СЮДА ТВОЙ URL (без слэша в конце)
        const DB_URL = 'https://orders-kostroma-default-rtdb.europe-west1.firebasedatabase.com';

        const productSelect = document.getElementById('productSelect');
        const quantityInput = document.getElementById('quantityInput');
        const totalPriceDisplay = document.getElementById('totalPriceDisplay');
        const statusDiv = document.getElementById('status');

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', loadProducts);

        // Функция загрузки товаров из Firebase
        async function loadProducts() {
            try {
                const response = await fetch(`\${DB_URL}/products.json`);
                
                if (!response.ok) throw new Error('Не удалось получить данные');
                
                const data = await response.json();

                if (!data) {
                    productSelect.innerHTML = '<option value="">Нет товаров в базе</option>';
                    updateTotal();
                    return;
                }

                productSelect.innerHTML = '<option value="">Выберите товар</option>';
                
                // Преобразуем объект в массив и заполняем список
                Object.keys(data).forEach(key => {
                    const product = data[key];
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `${product.name} (${product.price} ₽/кг)`;
                    option.dataset.price = product.price;
                    productSelect.appendChild(option);
                });

                // Пересчитываем цену при выборе товара
                productSelect.addEventListener('change', updateTotal);
                quantityInput.addEventListener('input', updateTotal);

                updateTotal();
                statusDiv.textContent = 'Товары загружены';
                statusDiv.className = 'success';

            } catch (error) {
                console.error('Ошибка:', error);
                productSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                statusDiv.textContent = 'Ошибка: проверьте консоль (F12) и правила доступа в Firebase';
                statusDiv.className = 'error';
            }
        }

        // Функция пересчета итоговой цены
        function updateTotal() {
            const selectedOption = productSelect.options[productSelect.selectedIndex];
            const price = parseFloat(selectedOption.dataset.price) || 0;
            const quantity = parseFloat(quantityInput.value) || 0;
            const total = price * quantity;
            totalPriceDisplay.value = total > 0 ? `\${total.toFixed(2)} ₽` : '';
        }

        // Функция отправки заказа в Firebase
        async function sendOrder() {
            const selectedOption = productSelect.options[productSelect.selectedIndex];
            const productId = selectedOption.value;
            const productName = selectedOption.textContent.split(' (');
            const quantity = parseFloat(quantityInput.value);
            const pricePerKg = parseFloat(selectedOption.dataset.price);
            const total = quantity * pricePerKg;

            if (!productId || quantity <= 0) {
                statusDiv.textContent = 'Пожалуйста, выберите товар и укажите количество';
                statusDiv.className = 'error';
                return;
            }

            statusDiv.textContent = 'Отправка заказа...';
            statusDiv.className = 'success';

            try {
                // Генерируем уникальный ID заказа (можно использовать Date.now())
                const orderId = Date.now().toString();
                
                const orderData = {
                    product_id: productId,
                    product_name: productName,
                    quantity_kg: quantity,
                    price_per_kg: pricePerKg,
                    total_price: total,
                    timestamp: new Date().toISOString()
                };

                // Отправляем POST запрос для создания нового заказа (push)
                const response = await fetch(`\${DB_URL}/orders.json`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    statusDiv.textContent = 'Заказ успешно оформлен!';
                    statusDiv.className = 'success';
                    // Сброс формы
                    productSelect.value = '';
                    quantityInput.value = '1';
                    totalPriceDisplay.value = '';
                    updateTotal();
                } else {
                    throw new Error('Ошибка сети');
                }
            } catch (error) {
                console.error('Ошибка отправки:', error);
                statusDiv.textContent = 'Не удалось отправить заказ. Проверьте консоль.';
                statusDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
